name: Feature Request / 機能要望
description: Suggest an idea / 機能の提案をする
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        ## ⚠️ 警告: このリポジトリは一般公開の OSS です

        **社内 API キー、内部 URL、アカウント情報、社内でのみ閲覧できる情報を絶対に含めないでください。**

        Issue の本文と編集履歴は誰でも閲覧でき、投稿後に削除しても完全には消えない場合があります。
        次の情報は記載しないでください。

        - アクセストークン・API キー・client secret・パスワードなどの認証情報
        - 社内システムや検証環境の URL・ホスト名・IP アドレス
        - 実在する事業所名・会社名・個人名、事業所番号・ユーザー ID などの識別子
        - メールアドレス・電話番号などの連絡先
        - 社内でのみ閲覧できる情報（社内ドキュメント・チケット・社内チャットの URL や引用・スクリーンショット、未公開の仕様やリリース予定、社外に公開していない運用情報など）

        ユースケースや設定例は、上記をすべてダミー値に置き換えたうえで記載してください。

        ---

        ## ⚠️ Warning: this is a public open source repository

        **Never include internal API keys, internal URLs, account information, or anything that is
        only accessible inside your organization.**

        Issue bodies and their edit history are visible to anyone and may persist even after deletion.
        Do not post access tokens, API keys, client secrets or passwords; internal or staging URLs,
        hostnames or IP addresses; real company/office names, personal names, office/user IDs;
        contact information; or anything only visible inside your organization, such as links to,
        quotations from or screenshots of internal documents, tickets or chat, unreleased
        specifications and release plans, or non-public operational details. Replace all of these
        with dummy values in use cases and examples.
  - type: checkboxes
    id: no-sensitive-info
    attributes:
      label: 機密情報の確認 / Sensitive information check
      options:
        - label: この Issue に認証情報・内部 URL・アカウント情報・社内でのみ閲覧できる情報を含めていません / This issue contains no credentials, internal URLs, account information, or organization-internal information
          required: true
  - type: textarea
    id: summary
    attributes:
      label: Summary / 概要
      description: A clear description of the feature / 提案する機能の概要
    validations:
      required: true
  - type: textarea
    id: use-case
    attributes:
      label: Use Case / ユースケース
      description: What problem does this solve? / どんな課題を解決しますか？
    validations:
      required: true
  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected Behavior / 期待する動作
      description: How should it work? / 具体的にどう動いてほしいか
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives / 代替手段
      description: Any workarounds you currently use / 現状の回避策があれば
    validations:
      required: false
